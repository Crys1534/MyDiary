apply plugin: 'com.android.application'

android {
    namespace 'com.kiminonawa.mydiary'
    compileSdk 35

    defaultConfig {
        applicationId "com.kiminonawa.mydiary"
        minSdk 21
        targetSdk 34

        // versionName rule
        // version.yyMMDD_BuildCount_OPTION ,
        // BuildCount_OPTION: D = demo , A = alpha,  H = hotfix
        versionCode 35
        versionName "0.3.0.170424_1_A"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The build number of the GitHub build (apk-N); shown in Settings next to "Check for updates".
        buildConfigField "String", "BUILD_NUMBER", "\"${project.hasProperty('buildNumber') ? project.property('buildNumber') : 'local'}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        debug {
            // Fixed key, so every build is signed the same and installs over the previous one
            // without losing the diary data.
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            // Installs next to any other MyDiary (for example the Google Play one)
            // instead of clashing with it. The app name is changed in src/debug/res.
            applicationIdSuffix '.fotos'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES',
                         'META-INF/*.kotlin_module', 'META-INF/INDEX.LIST']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {

    //Compile jar
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    //Android lib (AndroidX)
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    //To read the rotation of a picture from any gallery app
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    //Lib
    implementation 'info.hoang8f:android-segmented:1.0.6'
    implementation 'com.larswerkman:HoloColorPicker:1.5'
    implementation 'com.yalantis:ucrop:2.2.0-native'
    implementation 'commons-io:commons-io:2.5'
    implementation 'de.hdodenhof:circleimageview:2.1.0'
    //jp.wasabeef:recyclerview-animators:2.2.3 (required by this library) disappeared with jcenter.
    //The app only uses ItemTouchHelperViewHolder from it, so the animators are excluded.
    implementation('com.marshalchen.ultimaterecyclerview:library:0.7.0') {
        exclude group: 'jp.wasabeef', module: 'recyclerview-animators'
    }
    implementation('com.h6ah4i.android.widget.advrecyclerview:advrecyclerview:0.10.4@aar') {
        transitive = true
    }
    //Fresco photo
    implementation 'com.facebook.fresco:fresco:1.2.0'

    //Year class to check the old devices
    implementation 'com.facebook.device.yearclass:yearclass:2.0.0'

    implementation 'com.google.code.gson:gson:2.8.0'
    //For diary to show themonth mode
    implementation 'com.prolificinteractive:material-calendarview:1.4.3'
    //For OOBE
    implementation 'com.github.amlcurran.showcaseview:library:5.4.3'

    //For contacts
    implementation files('libs/pinyin4j-2.5.0.jar')

    implementation project(path: ':zoomable')
}
