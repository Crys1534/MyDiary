# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# The project uses AndroidX. Some libraries of 2017 still use the old "support"
# libraries: the Jetifier converts them while building.
android.useAndroidX=true
android.enableJetifier=true

# Keep the old way of the R class (all resources in one R class, as in 2017 code).
android.nonTransitiveRClass=false
android.nonFinalResIds=false
