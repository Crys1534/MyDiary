apply plugin: 'com.android.library'

android {
    namespace 'com.facebook.samples.zoomable'
    compileSdk 35

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.nineoldandroids:library:2.4.0'
    implementation 'com.facebook.fresco:drawee:2.6.0'
    implementation 'com.facebook.fresco:fbcore:2.6.0'
    implementation 'com.facebook.fresco:imagepipeline:2.6.0'
    api project(':gestures')
}
