name: Build APK

# Builds the debug APK on GitHub's servers and publishes it as a release,
# so it can be downloaded and installed on an Android phone.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The Android SDK pieces the build needs.
      # This runs before the Java of the build is selected because the SDK manager has its own Java.
      - name: Install the old Android SDK pieces
        run: |
          exec > >(tee -a setup.log) 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME JAVA_HOME=$JAVA_HOME"
          ls "$ANDROID_HOME" "$ANDROID_HOME/cmdline-tools" || true
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          echo "sdkmanager: $SDKM"
          yes | sudo env "JAVA_HOME=$JAVA_HOME" "$SDKM" --licenses > /dev/null || true
          # These two are required.
          sudo env "JAVA_HOME=$JAVA_HOME" "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          # This one is optional, so a failure here must not stop the build.
          sudo env "JAVA_HOME=$JAVA_HOME" "$SDKM" "platform-tools" || true
          sudo env "JAVA_HOME=$JAVA_HOME" "$SDKM" --list_installed || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }} assembleDebug 2>&1 | tee build.log

      - name: Collect the APK
        run: |
          APK=$(find app/build/outputs -name '*debug*.apk' | head -n 1)
          echo "APK found: $APK"
          cp "$APK" MyDiary-debug.apk
          # Report of what Android will see: package id, SDK versions, CPU types and signature.
          BT="$ANDROID_HOME/build-tools/35.0.0"
          {
            ls -l MyDiary-debug.apk
            "$BT/aapt" dump badging MyDiary-debug.apk | grep -E "^package|sdkVersion|targetSdkVersion|native-code|application-label:" || true
            "$BT/apksigner" verify --verbose --print-certs MyDiary-debug.apk || true
          } > apk-info.txt 2>&1 || true
          cat apk-info.txt

      - name: Save the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDiary-debug-apk
          path: MyDiary-debug.apk

      - name: Publish the APK as a release
        # A commit with [no-release] in its message only tests things and is not published.
        if: ${{ !contains(github.event.head_commit.message, '[no-release]') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          prerelease: true
          files: MyDiary-debug.apk

      # Keeps the end of the build log on its own branch, so a failed build can be diagnosed.
      - name: Publish the build log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/ci
          if [ -f setup.log ]; then tail -n 400 setup.log > /tmp/ci/setup.log; else echo "no setup.log" > /tmp/ci/setup.log; fi
          if [ -f apk-info.txt ]; then cp apk-info.txt /tmp/ci/apk-info.txt; fi
          if [ -f build.log ]; then
            tail -n 2500 build.log > /tmp/ci/build.log
          else
            echo "No build.log: the job stopped before the Gradle build." > /tmp/ci/build.log
          fi
          echo "result=${{ job.status }} run=${{ github.run_number }} commit=${{ github.sha }}" > /tmp/ci/status.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --quiet .
          cp /tmp/ci/build.log /tmp/ci/setup.log /tmp/ci/status.txt .
          if [ -f /tmp/ci/apk-info.txt ]; then cp /tmp/ci/apk-info.txt .; git add -f apk-info.txt; fi
          git add -f build.log setup.log status.txt
          git commit --quiet -m "Build log for run ${{ github.run_number }}"
          git push --force origin ci-logs

  # Optional: starts the app in an Android emulator and takes screenshots.
  # It only runs when the commit message contains [smoke].
  smoke:
    needs: build
    if: contains(github.event.head_commit.message, '[smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MyDiary-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app in the emulator
        continue-on-error: true
        run: bash smoke/emulator.sh

      - name: Publish the smoke test results
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/smoke
          cp -r smoke-out/. /tmp/smoke/ 2>/dev/null || echo "no smoke-out" > /tmp/smoke/none.txt
          echo "result=${{ job.status }} commit=${{ github.sha }}" > /tmp/smoke/status.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan smoke-logs
          git rm -rf --quiet .
          git clean -fdxq
          cp -r /tmp/smoke/. .
          git add -f .
          git commit --quiet -m "Smoke test for ${{ github.sha }}"
          git push --force origin smoke-logs
